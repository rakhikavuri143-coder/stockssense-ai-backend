services:
  - type: web
    name: stockssense-ai
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAPER_CAPITAL
        value: "10000"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "90"
