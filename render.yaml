services:
  - type: web
    name: stockssense-ai
    env: python
    plan: free
    buildCommand: pip install --no-cache-dir -r requirements.txt && find . -type d -name __pycache__ -exec rm -rf {} + 2>/dev/null; true
    startCommand: python run_server.py
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PAPER_CAPITAL
        value: "10000"
      - key: AI_CONFIDENCE_THRESHOLD
        value: "90"

